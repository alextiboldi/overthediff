[package]
name = "otd-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "OverTheDiff's main-window shell: the tab strip, the Home launcher tab and the status bar"

[lints]
workspace = true

[dependencies]
egui = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true }
# `default_fonts` so that the tests lay out text, as the app does.
egui = { workspace = true, features = ["default_fonts"] }
