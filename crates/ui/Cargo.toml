[package]
name = "otd-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "OverTheDiff's main-window shell: the tab strip, the Home launcher tab, the status bar, background-task progress and the Session Settings dialog"

[lints]
workspace = true

[dependencies]
egui = { workspace = true }
otd-core = { path = "../core" }
otd-format = { path = "../format" }

[dev-dependencies]
egui_kittest = { workspace = true }
# `default_fonts` so that the tests lay out text, as the app does.
egui = { workspace = true, features = ["default_fonts"] }
