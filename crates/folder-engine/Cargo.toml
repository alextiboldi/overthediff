[package]
name = "otd-folder-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "OverTheDiff's folder comparison engine: two trees read through the data-source contract, aligned and compared, without a UI"

[lints]
workspace = true

# No UI dependency: `cargo xtask ui-free` fails if one reaches a crate under crates/.
[dependencies]
otd-source = { path = "../source" }
# CRC-32 for the CRC content test (MIT OR Apache-2.0, already in the lock file through png).
crc32fast = "1.5"
