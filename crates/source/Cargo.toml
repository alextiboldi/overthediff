[package]
name = "otd-source"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "OverTheDiff's data-source contract, its in-memory reference source and the contract suite every provider runs"

[lints]
workspace = true

# No UI dependency (`cargo xtask ui-free`).
[dependencies]
# The local provider's crash-safe writes.
craft-atomic = { workspace = true }
# The local provider's OS recycle bin or trash.
trash = "5.4"
# The zip provider: craft-zip's guard before an archive is indexed, and the `zip` crate it wraps for
# what craft-zip doesn't expose yet (each entry's stored CRC, time and data). Same version and
# features as craft-zip's, so there is one copy.
craft-zip = { workspace = true }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# A zip entry's DOS time is local time with no zone.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Whether a local path is on a network share, which has no recycle bin, which file system it is
# on, whether it is mounted read-only, and setting a modified time without following links.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }
# The local provider's owner and group names. No default features, so it needs only libc.
uzers = { version = "0.12", default-features = false }

# Whether a macOS volume's names differ by case (`pathconf`), which rustix doesn't offer.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# The same on Windows (`GetVolumeInformationByHandleW`), and setting attribute codes, which std
# can't beyond read-only.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
craft-testkit = { workspace = true }
tempfile = "3"
