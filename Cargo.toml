[workspace]
resolver = "3"
# Globs, so a new crate under apps/ or crates/ joins without editing this list. Workspace crates
# depend on each other by relative `path` in their own manifest, not through
# [workspace.dependencies], so adding one doesn't touch this file either.
members = ["apps/*", "crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/alextiboldi/overthediff"
publish = false

[workspace.dependencies]
# The egui family is 0.37, patched onto the storytold fork below.
eframe = { version = "0.37", default-features = false }
egui = { version = "0.37", default-features = false }
# UI tests: renderless (no wgpu or snapshot feature), so they run on CI without a GPU.
egui_kittest = { version = "0.37", default-features = false }
# craft-libs crates all come from this one revision on storytold/craft-libs `main` (AGENTS.md
# rule 10). Moving it is a pull request of its own.
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "2c81ed850319ef3504ce56d82379b346522af18e" }
craft-testkit = { git = "https://github.com/storytold/craft-libs", rev = "2c81ed850319ef3504ce56d82379b346522af18e" }
# Single-instance hand-off (otd-launch): local socket or named pipe, token auth, instance records.
craft-ipc = { git = "https://github.com/storytold/craft-libs", rev = "2c81ed850319ef3504ce56d82379b346522af18e" }
# Translation lookup (otd-core's `i18n`): catalogs, fallback to the English key, plurals, `{name}` filling.
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "2c81ed850319ef3504ce56d82379b346522af18e" }
# Chords, default bindings and their dispatch (otd-core declares, otd-ui dispatches).
craft-keymap = { git = "https://github.com/storytold/craft-libs", rev = "2c81ed850319ef3504ce56d82379b346522af18e" }
# Menus laid out per platform: the in-window bar, and the native bar on macOS.
craft-menu = { git = "https://github.com/storytold/craft-libs", rev = "2c81ed850319ef3504ce56d82379b346522af18e" }
# Settings store (otd-settings): one TOML file in a per-user folder, atomic saves.
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "2c81ed850319ef3504ce56d82379b346522af18e" }
# Exit through the platform's own quit (macOS `terminate:`) once the unsaved-changes prompts allow it.
craft-quit = { git = "https://github.com/storytold/craft-libs", rev = "2c81ed850319ef3504ce56d82379b346522af18e" }
# Native file and folder pickers that never block the event loop (otd-ui's path edit).
craft-dialogs = { git = "https://github.com/storytold/craft-libs", rev = "2c81ed850319ef3504ce56d82379b346522af18e" }
# Legacy single-byte code pages, for text that is neither UTF-8 nor UTF-16 (otd-text-compare).
craft-codepage = { git = "https://github.com/storytold/craft-libs", rev = "2c81ed850319ef3504ce56d82379b346522af18e" }

[workspace.lints.rust]
# `deny`, not `forbid`, so a module AGENTS.md names can `allow(unsafe_code)` (rule 13).
unsafe_code = "deny"

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0

# Keep the complete egui family and native event bridge on the reviewed storytold fork commits
# that the Craft suite and craft-libs use.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_kittest = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_system_font_provider = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_demo_lib = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_inspection = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }
