[package]
name = "otd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "OverTheDiff desktop app"

[lints]
workspace = true

[dependencies]
otd-core = { path = "../../crates/core" }
otd-folder-engine = { path = "../../crates/folder-engine" }
otd-launch = { path = "../../crates/launch" }
otd-settings = { path = "../../crates/settings" }
otd-source = { path = "../../crates/source" }
otd-ui = { path = "../../crates/ui" }
craft-menu = { workspace = true }
craft-quit = { workspace = true, features = ["egui"] }
eframe = { workspace = true, features = ["wgpu", "accesskit", "wayland", "x11", "default_fonts"] }

[dev-dependencies]
craft-testkit = { workspace = true }
egui_kittest = { workspace = true }
tempfile = "3"
